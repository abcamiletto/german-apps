name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.3

      - name: Run the sync server tests
        working-directory: server
        run: uv run pytest

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: database/package-lock.json

      - name: Check and test the database functions
        working-directory: database
        run: |
          npm ci
          npm run typecheck
          npm test

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v4
        with:
          packages: "platforms;android-37.0 build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v6

      # Ubuntu's AppArmor profile otherwise stops headless Chrome from starting its sandbox.
      - name: Allow Chrome to run the web tests
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Run shared tests on Android and in Chrome
        run: ./gradlew :shared:testAndroidHostTest :shared:wasmJsBrowserTest

      # This has to stay ahead of the signing key: once it is set, Gradle also needs the passwords to configure :app.
      - name: Build the website
        run: ./gradlew :web:wasmJsBrowserDistribution

      - name: Decode signing key
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_BASE64: ${{ secrets.WORTSCHATZ_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "WORTSCHATZ_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build release APK
        env:
          WORTSCHATZ_KEYSTORE_PASSWORD: ${{ secrets.WORTSCHATZ_KEYSTORE_PASSWORD }}
          WORTSCHATZ_KEY_ALIAS: ${{ secrets.WORTSCHATZ_KEY_ALIAS }}
          WORTSCHATZ_KEY_PASSWORD: ${{ secrets.WORTSCHATZ_KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - uses: actions/upload-artifact@v7
        with:
          name: wortschatz-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Check that every word has an image and a clip
        id: media
        run: |
          assets=content
          words=$(jq length "$assets/words.json")
          images=$(find "$assets/images" -name '*.webp' | wc -l)
          clips=$(find "$assets/audio" -name '*.ogg' | wc -l)
          echo "words=$words images=$images clips=$clips"
          if [ "$images" -eq "$words" ] && [ "$clips" -eq "$words" ]; then
            echo "complete=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy the database functions
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.media.outputs.complete == 'true'
        working-directory: database
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: npx convex deploy --yes

      - name: Publish the APK and the website as a GitHub release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.media.outputs.complete == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v1.0.${GITHUB_RUN_NUMBER}"
          cp app/build/outputs/apk/release/app-release.apk "wortschatz-${tag}.apk"
          # The Mac mini downloads this within five minutes. See server/deploy/deploy.sh.
          site=web/build/dist/wasmJs/productionExecutable
          find "$site" -maxdepth 1 -type f \( -name '*.wasm' -o -name '*.js' -o -name '*.json' \) -exec gzip -9k {} +
          tar -czf "wortschatz-website-${tag}.tar.gz" -C "$site" .
          gh release create "$tag" "wortschatz-${tag}.apk" "wortschatz-website-${tag}.tar.gz" \
            --title "Wortschatz ${tag}" --generate-notes --latest
