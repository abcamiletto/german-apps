<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#F6F7FB">
  <meta name="description" content="Learn German nouns, verbs and adjectives up to B1, with a picture and a pronunciation for every word.">
  <title>Wortschatz</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="icon.png" type="image/png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="preload" href="icon.png" as="image">
  <style>
    html, body { height: 100%; margin: 0; overflow: hidden; background: #F6F7FB; }
    #splash { position: fixed; inset: 0; z-index: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 24px; }
    #splash img { width: 112px; height: 112px; }
    #splash div { width: 112px; height: 4px; border-radius: 2px; overflow: hidden; background: #E7EAF1; }
    #splash div::after { content: ""; display: block; width: 40%; height: 100%; border-radius: 2px; background: #14213D; animation: load 1.2s ease-in-out infinite alternate; }
    @keyframes load { from { transform: translateX(0); } to { transform: translateX(150%); } }
    @media (prefers-reduced-motion: reduce) { #splash div::after { animation: none; } }
  </style>
  <script src="wortschatz.js" defer></script>
</head>
<body><div id="splash" role="status" aria-label="Loading"><img src="icon.png" width="112" height="112" alt=""><div></div></div></body>
</html>
